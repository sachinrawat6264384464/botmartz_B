<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Three-layer production agent stack</title>
  <desc id="d">Orchestration and reasoning on top, tool and data interface through MCP in the middle, guardrails and permissions at the base, with a human reviewer connected to the orchestration layer.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F172A"/></marker></defs>
  <rect width="1200" height="560" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0F172A">The production agent stack: three layers, each with a job</text>
  <text x="40" y="80" font-size="14" fill="#475569">Illustrative reference architecture.</text>

  <rect x="40" y="110" width="820" height="110" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
  <text x="64" y="144" font-size="18" font-weight="700" fill="#0F172A">1 · Orchestration and reasoning</text>
  <text x="64" y="170" font-size="14" fill="#475569">LangGraph state graph · named steps · bounded recursion · checkpoints · pause for approval</text>
  <text x="64" y="196" font-size="13" fill="#64748B">Decides what happens next, within explicit limits, and can resume after failure</text>

  <rect x="40" y="240" width="820" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>
  <text x="64" y="274" font-size="18" font-weight="700" fill="#0F172A">2 · Tool and data interface (MCP)</text>
  <text x="64" y="300" font-size="14" fill="#475569">MCP servers expose tools, resources and prompts · database · documents · ticketing · messaging</text>
  <text x="64" y="326" font-size="13" fill="#64748B">Standard connection to systems. Not a trust boundary by itself</text>

  <rect x="40" y="370" width="820" height="110" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5"/>
  <text x="64" y="404" font-size="18" font-weight="700" fill="#0F172A">3 · Guardrails and permissions</text>
  <text x="64" y="430" font-size="14" fill="#475569">Schema validation · least-privilege credentials · read/write tool separation · audit log</text>
  <text x="64" y="456" font-size="13" fill="#64748B">Constrains what the agent may see and do, and records what it did</text>

  <rect x="930" y="130" width="230" height="70" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
  <text x="952" y="160" font-size="15" font-weight="700" fill="#0F172A">Human reviewer</text><text x="952" y="182" font-size="12.5" fill="#475569">Approves risky actions</text>
  <line x1="928" y1="165" x2="862" y2="165" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
  <text x="880" y="156" font-size="11.5" fill="#475569">interrupt / resume</text>

  <rect x="930" y="290" width="230" height="70" rx="12" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
  <text x="952" y="320" font-size="15" font-weight="700" fill="#0F172A">Enterprise systems</text><text x="952" y="342" font-size="12.5" fill="#475569">Data, files, workflows</text>
  <line x1="928" y1="325" x2="862" y2="325" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="930" y="420" width="230" height="70" rx="12" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="2"/>
  <text x="952" y="450" font-size="15" font-weight="700" fill="#0F172A">Golden-set evals</text><text x="952" y="472" font-size="12.5" fill="#475569">Regression gate in CI</text>
  <line x1="928" y1="455" x2="862" y2="455" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
</svg>

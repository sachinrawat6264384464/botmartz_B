<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Cellular architecture for production AI systems: process and network boundaries</title>
  <desc id="d">Four layers: an asynchronous ingestion cell, a single-deployable query cell containing retrieval, fusion, reranking, context building and the agent graph runner, a Postgres workflow and state layer, and an independently scaled model serving layer. Solid lines are in-process or local calls; dashed lines cross the network.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F172A"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0284C7"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0F172A">Where the boundaries sit: what shares a process, what crosses the network</text>
  <text x="40" y="80" font-size="14" fill="#475569">Botmartz working pattern for retrieval-heavy agent systems. Illustrative reference topology, not a measured benchmark.</text>

  <!-- Ingestion cell -->
  <rect x="40" y="120" width="330" height="250" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="152" font-size="17" font-weight="700" fill="#0F172A">1 · Ingestion cell</text>
  <text x="62" y="174" font-size="13" fill="#475569">Asynchronous, elastic CPU workers</text>
  <rect x="62" y="192" width="286" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/><text x="78" y="214" font-size="13" fill="#0F172A">Parse / OCR / layout analysis</text>
  <rect x="62" y="236" width="286" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/><text x="78" y="258" font-size="13" fill="#0F172A">Chunking + metadata extraction</text>
  <rect x="62" y="280" width="286" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/><text x="78" y="302" font-size="13" fill="#0F172A">Embedding + index build</text>
  <text x="62" y="346" font-size="12" fill="#64748B">Scales on queue depth, not on query traffic</text>

  <!-- Query cell -->
  <rect x="440" y="120" width="720" height="250" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
  <text x="462" y="152" font-size="17" font-weight="700" fill="#0F172A">2 · Query cell (one deployable unit)</text>
  <text x="462" y="174" font-size="13" fill="#475569">Hot path stays in-process or on local IPC</text>
  <rect x="462" y="200" width="125" height="64" rx="10" fill="#ECFEFF" stroke="#67E8F9"/><text x="474" y="226" font-size="13" font-weight="600" fill="#0F172A">Retrieval</text><text x="474" y="246" font-size="12" fill="#475569">BM25 + ANN</text>
  <rect x="608" y="200" width="110" height="64" rx="10" fill="#ECFEFF" stroke="#67E8F9"/><text x="620" y="226" font-size="13" font-weight="600" fill="#0F172A">Fusion</text><text x="620" y="246" font-size="12" fill="#475569">RRF / filters</text>
  <rect x="739" y="200" width="110" height="64" rx="10" fill="#ECFEFF" stroke="#67E8F9"/><text x="751" y="226" font-size="13" font-weight="600" fill="#0F172A">Rerank</text><text x="751" y="246" font-size="12" fill="#475569">client / local</text>
  <rect x="870" y="200" width="130" height="64" rx="10" fill="#ECFEFF" stroke="#67E8F9"/><text x="882" y="226" font-size="13" font-weight="600" fill="#0F172A">Context build</text><text x="882" y="246" font-size="12" fill="#475569">citations, ACLs</text>
  <rect x="1021" y="200" width="120" height="64" rx="10" fill="#ECFEFF" stroke="#67E8F9"/><text x="1033" y="226" font-size="13" font-weight="600" fill="#0F172A">Agent graph</text><text x="1033" y="246" font-size="12" fill="#475569">runner</text>
  <line x1="587" y1="232" x2="606" y2="232" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="718" y1="232" x2="737" y2="232" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="849" y1="232" x2="868" y2="232" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1000" y1="232" x2="1019" y2="232" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
  <text x="462" y="304" font-size="12" fill="#64748B">Solid arrows: function calls or local IPC. Agent loops multiply these hops, which is why this segment is kept together.</text>
  <text x="462" y="330" font-size="12" fill="#64748B">Isolation between components comes from module boundaries and, where needed, separate processes on local sockets.</text>

  <!-- ingestion to query (indexes via network/object store) -->
  <line x1="370" y1="245" x2="438" y2="245" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <text x="372" y="236" font-size="11" fill="#0284C7">indexes</text>

  <!-- State layer -->
  <rect x="40" y="440" width="540" height="190" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="62" y="472" font-size="17" font-weight="700" fill="#0F172A">3 · Workflow and state layer</text>
  <text x="62" y="494" font-size="13" fill="#475569">PostgreSQL (durable store)</text>
  <rect x="62" y="512" width="236" height="36" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/><text x="76" y="535" font-size="13" fill="#0F172A">Workflow checkpoints</text>
  <rect x="318" y="512" width="236" height="36" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/><text x="332" y="535" font-size="13" fill="#0F172A">Idempotency keys + outbox</text>
  <rect x="62" y="560" width="236" height="36" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/><text x="76" y="583" font-size="13" fill="#0F172A">Append-only audit log</text>
  <rect x="318" y="560" width="236" height="36" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/><text x="332" y="583" font-size="13" fill="#0F172A">Human review queue</text>
  <text x="62" y="618" font-size="12" fill="#64748B">WAL gives durability; correctness comes from transaction design and idempotent tools</text>

  <!-- Model serving -->
  <rect x="640" y="440" width="520" height="190" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="662" y="472" font-size="17" font-weight="700" fill="#0F172A">4 · Model-serving layer</text>
  <text x="662" y="494" font-size="13" fill="#475569">Dedicated GPU nodes, scaled independently</text>
  <rect x="662" y="512" width="236" height="36" rx="8" fill="#FEF3C7" stroke="#FDE68A"/><text x="676" y="535" font-size="13" fill="#0F172A">LLM inference (e.g. vLLM)</text>
  <rect x="918" y="512" width="220" height="36" rx="8" fill="#FEF3C7" stroke="#FDE68A"/><text x="932" y="535" font-size="13" fill="#0F172A">Reranker / embedder (optional)</text>
  <text x="662" y="580" font-size="12" fill="#64748B">Separate because hardware, lifecycle and scaling differ from app logic</text>

  <!-- Query -> state, query -> model -->
  <line x1="700" y1="370" x2="420" y2="438" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <text x="470" y="398" font-size="11" fill="#0284C7">network: transactions</text>
  <line x1="1000" y1="370" x2="900" y2="438" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/>
  <text x="975" y="408" font-size="11" fill="#0284C7">network: gRPC/HTTP, streaming</text>

  <!-- Legend -->
  <line x1="40" y1="668" x2="90" y2="668" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/><text x="100" y="672" font-size="12" fill="#475569">in-process / local IPC</text>
  <line x1="260" y1="668" x2="310" y2="668" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="320" y="672" font-size="12" fill="#475569">crosses the network</text>
</svg>

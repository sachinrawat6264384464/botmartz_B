<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Decision flow: when to split an AI system component into a separate service</title>
  <desc id="d">Three questions in sequence: different hardware or scaling profile, independent security boundary or ownership, and hot-path chatty calls. Outcomes are separate service, separate service, keep in the same deployable, or default to a modular monolith.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0F172A"/></marker></defs>
  <rect width="1200" height="640" fill="#F8FAFC"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0F172A">Should this component be its own service?</text>
  <text x="40" y="80" font-size="14" fill="#475569">Answer in order. Stop at the first "yes".</text>

  <rect x="40" y="130" width="260" height="70" rx="12" fill="#0F172A"/><text x="60" y="162" font-size="15" font-weight="700" fill="#FFFFFF">New component in the</text><text x="60" y="184" font-size="15" font-weight="700" fill="#FFFFFF">AI system</text>

  <rect x="380" y="115" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
  <text x="400" y="146" font-size="14" font-weight="700" fill="#0F172A">Q1 · Different hardware or scaling profile?</text>
  <text x="400" y="170" font-size="12.5" fill="#475569">GPU vs CPU, bursty batch ingestion,</text><text x="400" y="190" font-size="12.5" fill="#475569">independent model lifecycle</text>

  <rect x="380" y="270" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
  <text x="400" y="301" font-size="14" font-weight="700" fill="#0F172A">Q2 · Needs its own security boundary,</text><text x="400" y="321" font-size="14" font-weight="700" fill="#0F172A">ownership, or release cadence?</text>
  <text x="400" y="348" font-size="12.5" fill="#475569">Separate team, compliance scope, blast radius</text>

  <rect x="380" y="425" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
  <text x="400" y="456" font-size="14" font-weight="700" fill="#0F172A">Q3 · Sits in the hot path with chatty calls?</text>
  <text x="400" y="480" font-size="12.5" fill="#475569">Retrieval ↔ rerank ↔ context build,</text><text x="400" y="500" font-size="12.5" fill="#475569">repeated across agent loop iterations</text>

  <line x1="300" y1="165" x2="378" y2="165" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="545" y1="215" x2="545" y2="268" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/><text x="556" y="246" font-size="12" fill="#475569">no</text>
  <line x1="545" y1="370" x2="545" y2="423" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/><text x="556" y="401" font-size="12" fill="#475569">no</text>

  <rect x="800" y="130" width="360" height="70" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
  <text x="820" y="160" font-size="14" font-weight="700" fill="#0F172A">Separate it</text><text x="820" y="182" font-size="12.5" fill="#475569">Model serving, ingestion workers</text>
  <rect x="800" y="285" width="360" height="70" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2"/>
  <text x="820" y="315" font-size="14" font-weight="700" fill="#0F172A">Separate service</text><text x="820" y="337" font-size="12.5" fill="#475569">Auth, billing / metering, audit ledger</text>
  <rect x="800" y="395" width="360" height="70" rx="12" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="2"/>
  <text x="820" y="425" font-size="14" font-weight="700" fill="#0F172A">Keep in one deployable</text><text x="820" y="447" font-size="12.5" fill="#475569">Modular monolith / query cell</text>
  <rect x="800" y="490" width="360" height="70" rx="12" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="2"/>
  <text x="820" y="520" font-size="14" font-weight="700" fill="#0F172A">Default: modular monolith</text><text x="820" y="542" font-size="12.5" fill="#475569">Revisit when a concrete pain appears</text>

  <line x1="710" y1="165" x2="798" y2="165" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/><text x="740" y="156" font-size="12" fill="#475569">yes</text>
  <line x1="710" y1="320" x2="798" y2="320" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/><text x="740" y="311" font-size="12" fill="#475569">yes</text>
  <line x1="710" y1="475" x2="798" y2="430" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/><text x="738" y="448" font-size="12" fill="#475569">yes</text>
  <line x1="710" y1="505" x2="798" y2="525" stroke="#0F172A" stroke-width="2" marker-end="url(#a)"/><text x="738" y="528" font-size="12" fill="#475569">no</text>
</svg>

    <g transform="translate(16, 172)">
      <rect width="218" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">Candidate Pruning</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10" fill="#64748B">Reduces 50 candidates down</text>
      <text x="14" y="60" font-family="sans-serif" font-size="10" fill="#64748B">to top-5 highest-scoring</text>
      <text x="14" y="74" font-family="sans-serif" font-size="10" fill="#64748B">grounded paragraphs</text>
    </g>

    <rect x="16" y="280" width="218" height="116" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="24" y="306" font-family="sans-serif" font-size="12" font-weight="700" fill="#065F46">Relevance Cutoff Filter</text>
    <text x="24" y="328" font-family="sans-serif" font-size="10.5" fill="#047857">Relevance Score &lt; 0.78?</text>
    <rect x="24" y="340" width="190" height="42" rx="6" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="32" y="358" font-family="monospace" font-size="10" font-weight="700" fill="#B91C1C">REFUSE GUESSING</text>
    <text x="32" y="372" font-family="sans-serif" font-size="9" fill="#64748B">Mandatory "I do not know" flag</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 880,330 L 918,330" stroke="#0284C7" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>


      <text x="14" y="46" font-family="sans-serif" font-size="10" fill="#64748B">Deep cross-attention scoring</text>
      <text x="14" y="60" font-family="sans-serif" font-size="10" fill="#64748B">between full query string &amp;</text>
      <text x="14" y="74" font-family="sans-serif" font-size="10" fill="#64748B">document passages</text>

  <g transform="translate(920, 120)">
    <rect width="230" height="420" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="230" height="48" rx="16" fill="#F0F9FF"/>
    <text x="18" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#0369A1">04 · VERIFIED OUTPUT</text>
    <text x="175" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#10B981">LOCK</text>

    <g transform="translate(14, 64)">
      <rect width="202" height="96" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="24" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">Token Grounding Engine</text>
      <text x="12" y="44" font-family="sans-serif" font-size="9.5" fill="#64748B">Every factual assertion</text>
      <text x="12" y="58" font-family="sans-serif" font-size="9.5" fill="#64748B">tagged with exact byte-range</text>
      <text x="12" y="72" font-family="sans-serif" font-size="9.5" fill="#64748B">&amp; page number provenance</text>
    </g>

    <g transform="translate(14, 172)">
      <rect width="202" height="96" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="24" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">RAGAS Eval Telemetry</text>
      <text x="12" y="44" font-family="sans-serif" font-size="9.5" fill="#64748B">Faithfulness: 99.4%</text>
      <text x="12" y="58" font-family="sans-serif" font-size="9.5" fill="#64748B">Answer Relevance: 98.7%</text>
      <text x="12" y="72" font-family="sans-serif" font-size="9.5" fill="#64748B">Context Precision: 97.9%</text>
    </g>

    <rect x="14" y="280" width="202" height="116" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="22" y="306" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#1E40AF">Production Answer</text>
    <rect x="22" y="320" width="186" height="64" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="30" y="338" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">Verifiable Verdict ✓</text>
    <text x="30" y="352" font-family="sans-serif" font-size="9" fill="#0284C7">Source: FAA_Part145.pdf §3.2</text>
    <text x="30" y="366" font-family="sans-serif" font-size="9" fill="#10B981">Hash: SHA-256 Verified</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(40, 570)">
    <rect width="1120" height="74" rx="14" fill="#0F172A" filter="url(#cardShadow)"/>
    <g transform="translate(40, 18)">
      <text x="0" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8">P99 RETRIEVAL SPEED</text>
      <text x="0" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#38BDF8">&lt; 118ms</text>
    </g>
    <line x1="280" y1="14" x2="280" y2="60" stroke="#334155" stroke-width="1"/>
    <g transform="translate(320, 18)">
      <text x="0" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8">CITATION FIDELITY</text>
      <text x="0" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#34D399">100.0% Exact</text>
    </g>
    <line x1="560" y1="14" x2="560" y2="60" stroke="#334155" stroke-width="1"/>
    <g transform="translate(600, 18)">
      <text x="0" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8">HALLUCINATED ANCHORS</text>
      <text x="0" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#F87171">0 (Zero Guessing)</text>
    </g>
    <line x1="860" y1="14" x2="860" y2="60" stroke="#334155" stroke-width="1"/>
    <g transform="translate(900, 18)">
      <text x="0" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8">DEPLOYMENT ENVIRONMENT</text>
      <text x="0" y="42" font-family="sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Private VPC / Bare Metal</text>
    </g>
  </g>
</svg>

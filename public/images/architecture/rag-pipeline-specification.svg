<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#0284C7"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="680" rx="20" fill="url(#bgGlow)" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.4">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320 M 0,400 L 1200,400 M 0,480 L 1200,480 M 0,560 L 1200,560" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 160,0 L 160,680 M 320,0 L 320,680 M 480,0 L 480,680 M 640,0 L 640,680 M 800,0 L 800,680 M 960,0 L 960,680 M 1120,0 L 1120,680" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Header Strip -->
  <rect x="40" y="32" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="68" cy="60" r="6" fill="#10B981"/>
  <text x="86" y="65" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="1">BOTMARTZ VERIFIED DEFENSIVE RAG PIPELINE SPECIFICATION</text>
  <rect x="1000" y="44" width="140" height="32" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="1015" y="65" font-family="monospace" font-size="11" font-weight="700" fill="#0284C7">P99 &lt; 118MS LATENCY</text>

  <!-- ══════════ STAGE 1: INGESTION & AST CHUNKING ══════════ -->
  <g transform="translate(50, 120)">
    <rect width="250" height="420" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="250" height="48" rx="16" fill="#F0F9FF"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#0369A1">01 · INGESTION &amp; AST</text>
    <text x="195" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#0284C7">STAGE</text>

    <!-- Sub-cards -->
    <g transform="translate(16, 64)">
      <rect width="218" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">Layout-Aware PDF Parser</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10.5" fill="#64748B">Preserves tables, footnotes &amp;</text>
      <text x="14" y="60" font-family="sans-serif" font-size="10.5" fill="#64748B">multi-column legal hierarchy</text>
    </g>

    <g transform="translate(16, 150)">
      <rect width="218" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">SHA-256 Hash Ledger</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10.5" fill="#64748B">Cryptographic provenance lock</text>
      <text x="14" y="60" font-family="sans-serif" font-size="10.5" fill="#64748B">Zero hallucinated sources</text>
    </g>

    <g transform="translate(16, 236)">
      <rect width="218" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">Recursive AST Tokenizer</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10.5" fill="#64748B">512-token semantic blocks</text>
      <text x="14" y="60" font-family="sans-serif" font-size="10.5" fill="#64748B">with 64-token sliding overlap</text>
    </g>

    <rect x="16" y="330" width="218" height="66" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="26" y="354" font-family="monospace" font-size="10.5" font-weight="700" fill="#1E40AF">Output: Normalized</text>
    <text x="26" y="372" font-family="monospace" font-size="10.5" font-weight="700" fill="#1E40AF">Document Chunks + AST</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 300,330 L 338,330" stroke="#0284C7" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ══════════ STAGE 2: DUAL HYBRID INDEX ══════════ -->
  <g transform="translate(340, 120)">
    <rect width="250" height="420" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="250" height="48" rx="16" fill="#F0F9FF"/>
    <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="800" fill="#0369A1">02 · DUAL HYBRID INDEX</text>
    <text x="185" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#0284C7">FUSION</text>

    <!-- Branch A: Dense ANN -->
    <g transform="translate(16, 64)">
      <rect width="218" height="90" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <rect x="10" y="10" width="80" height="20" rx="4" fill="#E0F2FE"/>
      <text x="16" y="24" font-family="monospace" font-size="9.5" font-weight="700" fill="#0369A1">BRANCH A</text>
      <text x="10" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">Dense Vector ANN</text>
      <text x="10" y="66" font-family="sans-serif" font-size="10" fill="#64748B">Qdrant / Milvus HNSW Index</text>
      <text x="10" y="78" font-family="sans-serif" font-size="10" fill="#64748B">Cosine &amp; Inner Product Search</text>
    </g>

    <!-- Branch B: Sparse BM25 -->
    <g transform="translate(16, 166)">
      <rect width="218" height="90" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <rect x="10" y="10" width="80" height="20" rx="4" fill="#FEF3C7"/>
      <text x="16" y="24" font-family="monospace" font-size="9.5" font-weight="700" fill="#B45309">BRANCH B</text>
      <text x="10" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#0F172A">Sparse Lexical BM25</text>
      <text x="10" y="66" font-family="sans-serif" font-size="10" fill="#64748B">Exact statutory clause matching</text>
      <text x="10" y="78" font-family="sans-serif" font-size="10" fill="#64748B">SKUs, Part Numbers &amp; Acronyms</text>
    </g>

    <!-- Reciprocal Rank Fusion Core -->
    <g transform="translate(16, 270)">
      <rect width="218" height="126" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="26" font-family="monospace" font-size="11.5" font-weight="700" fill="#38BDF8">RECIPROCAL RANK FUSION</text>
      <text x="14" y="48" font-family="monospace" font-size="11" fill="#FFFFFF">RRF(d) = Σ 1 / (k + r(d))</text>
      <text x="14" y="70" font-family="sans-serif" font-size="10" fill="#94A3B8">Mathematical rank consolidation</text>
      <text x="14" y="86" font-family="sans-serif" font-size="10" fill="#94A3B8">k=60 empirical constant</text>
      <rect x="14" y="96" width="190" height="20" rx="4" fill="#1E293B"/>
      <text x="20" y="110" font-family="monospace" font-size="9.5" fill="#34D399">Top-50 merged candidates</text>
    </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="srvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="srvShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="20" fill="url(#srvBg)" stroke="#E2E8F0" stroke-width="2"/>
  
  <g opacity="0.4">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320 M 0,400 L 1200,400 M 0,480 L 1200,480 M 0,560 L 1200,560" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 160,0 L 160,680 M 320,0 L 320,680 M 480,0 L 480,680 M 640,0 L 640,680 M 800,0 L 800,680 M 960,0 L 960,680 M 1120,0 L 1120,680" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Header Strip -->
  <rect x="40" y="32" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#srvShadow)"/>
  <circle cx="68" cy="60" r="6" fill="#0284C7"/>
  <text x="86" y="65" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="1">BOTMARTZ CORE ENGINEERING CAPABILITIES MATRIX</text>
  <rect x="990" y="44" width="150" height="32" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="1005" y="65" font-family="monospace" font-size="11" font-weight="700" fill="#0284C7">ENTERPRISE GRADE</text>

  <!-- Service Pillar 1: Enterprise RAG -->
  <g transform="translate(60, 120)">
    <rect width="510" height="420" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" filter="url(#srvShadow)"/>
    <rect x="0" y="0" width="510" height="52" rx="16" fill="#F0F9FF"/>
    <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="800" fill="#0369A1">01 · ENTERPRISE RAG SYSTEMS</text>
    <rect x="400" y="14" width="90" height="24" rx="6" fill="#0284C7"/>
    <text x="412" y="30" font-family="monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">KNOWLEDGE</text>

    <!-- Sub Features -->
    <g transform="translate(24, 72)">
      <rect width="462" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Hybrid Sparse (BM25) + Dense (Qdrant) Retrieval</text>
      <text x="16" y="46" font-family="sans-serif" font-size="11" fill="#64748B">Combines exact keyword matching with semantic vector understanding.</text>
      <text x="16" y="60" font-family="sans-serif" font-size="11" fill="#64748B">Zero token blindness across statutory clauses and technical part numbers.</text>
    </g>

    <g transform="translate(24, 158)">
      <rect width="462" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Cross-Encoder Neural Reranking (ColBERT / BGE)</text>
      <text x="16" y="46" font-family="sans-serif" font-size="11" fill="#64748B">Re-scores the top-50 candidates down to top-5 most relevant chunks.</text>
      <text x="16" y="60" font-family="sans-serif" font-size="11" fill="#64748B">Refuses guessing when evidence is missing or relevance score is low.</text>
    </g>

    <g transform="translate(24, 244)">
      <rect width="462" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Layout-Aware PDF &amp; Table AST Extraction</text>
      <text x="16" y="46" font-family="sans-serif" font-size="11" fill="#64748B">Preserves complex multi-column tables, financial sheets, and footnotes.</text>
      <text x="16" y="60" font-family="sans-serif" font-size="11" fill="#64748B">SHA-256 hash provenance stamped on every returned answer citation.</text>
    </g>

    <!-- Bottom Specs -->
    <g transform="translate(24, 332)">
      <rect width="462" height="66" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="20" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#1D4ED8">Production Metrics: &lt; 118ms P99 Latency · 99.8% Grounding</text>
      <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#1E40AF">Deployable on private AWS/Azure VPCs or isolated on-premise hardware.</text>
    </g>
  </g>

  <!-- Service Pillar 2: AI Agents -->
  <g transform="translate(630, 120)">
    <rect width="510" height="420" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" filter="url(#srvShadow)"/>
    <rect x="0" y="0" width="510" height="52" rx="16" fill="#F0F9FF"/>
    <text x="24" y="32" font-family="sans-serif" font-size="16" font-weight="800" fill="#0369A1">02 · DETERMINISTIC AI AGENTS</text>
    <rect x="390" y="14" width="100" height="24" rx="6" fill="#0066FF"/>
    <text x="402" y="30" font-family="monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">WORKFLOWS</text>

    <!-- Sub Features -->
    <g transform="translate(24, 72)">
      <rect width="462" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">LangGraph State Machine Graphs (DAGs)</text>
      <text x="16" y="46" font-family="sans-serif" font-size="11" fill="#64748B">Explicit named states, transitions, error compensation, and rollbacks.</text>
      <text x="16" y="60" font-family="sans-serif" font-size="11" fill="#64748B">Zero runaway prompt loops with max recursion circuit breakers.</text>
    </g>

    <g transform="translate(24, 158)">
      <rect width="462" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Mandatory Human-in-the-Loop (HITL) Gates</text>
      <text x="16" y="46" font-family="sans-serif" font-size="11" fill="#64748B">State-changing ERP mutations, database writes, and payments require 1-click</text>
      <text x="16" y="60" font-family="sans-serif" font-size="11" fill="#64748B">human authorization via Slack or WhatsApp webhook bridges.</text>
    </g>

    <g transform="translate(24, 244)">
      <rect width="462" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#0F172A">Model Context Protocol (MCP) Standard</text>
      <text x="16" y="46" font-family="sans-serif" font-size="11" fill="#64748B">Connects securely to Postgres, Salesforce, SAP, Jira, and enterprise APIs</text>
      <text x="16" y="60" font-family="sans-serif" font-size="11" fill="#64748B">with least-privilege token access and strict Pydantic v2 schemas.</text>
    </g>

    <!-- Bottom Specs -->
    <g transform="translate(24, 332)">
      <rect width="462" height="66" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="20" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#1D4ED8">Production Metrics: Postgres WAL Checkpoint · 0 Runaways</text>
      <text x="20" y="48" font-family="sans-serif" font-size="11" fill="#1E40AF">Continuous background reconciliation loops with zero data drift.</text>
    </g>
  </g>

  <!-- Bottom Metric Strip -->
  <g transform="translate(40, 570)">
    <rect width="1120" height="74" rx="14" fill="#0F172A" filter="url(#srvShadow)"/>
    <g transform="translate(40, 18)">
      <text x="0" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8">INFRASTRUCTURE PRIVACY</text>
      <text x="0" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#38BDF8">Zero Public Cloud LLM Training</text>
    </g>
    <line x1="380" y1="14" x2="380" y2="60" stroke="#334155" stroke-width="1"/>
    <g transform="translate(420, 18)">
      <text x="0" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8">EVALUATION RIGOR</text>
      <text x="0" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#34D399">Automated RAGAS In CI/CD</text>
    </g>
    <line x1="720" y1="14" x2="720" y2="60" stroke="#334155" stroke-width="1"/>
    <g transform="translate(760, 18)">
      <text x="0" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#94A3B8">INTEGRATION TIMELINE</text>
      <text x="0" y="42" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">8–12 Weeks Production Ready</text>
    </g>
  </g>
</svg>
